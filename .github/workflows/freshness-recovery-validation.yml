name: Freshness recovery validation
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/freshness_guard.py
      - tests/test_freshness_guard.py
      - .github/workflows/fetch.yml
      - deploy/trigger.sh
      - index.html
      - energy-pro.css
      - tests/test_v901_freshness_browser.cjs
      - .github/workflows/freshness-recovery-validation.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash -n deploy/trigger.sh
          python -m unittest discover -s tests -v
          python scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/energy-public" >/tmp/energy-http.log 2>&1 &
          node tests/test_v901_freshness_browser.cjs
