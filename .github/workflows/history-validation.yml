name: Energy history chart validation
on:
  push:
    branches: [feature/energy-v62-67-history-charts-20261116]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: node --check nordl-charts.js && node --check research-tools.js && node --check market-reference.js && node tests/test_nordl_charts.cjs && node tests/test_atlas.cjs && node tests/test_visual_terminal.cjs
      - run: python -m unittest discover -s tests -v
      - run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          class Page(HTMLParser):
              def __init__(self):super().__init__();self.ids=[]
              def handle_starttag(self,t,a):self.ids.extend(v for k,v in a if k=='id')
          p=Page();p.feed(open('index.html').read())
          assert not [k for k,v in Counter(p.ids).items() if v>1]
          assert all(k in p.ids for k in ['historySummary','historyChart','historyTable','referenceChart'])
          PY
