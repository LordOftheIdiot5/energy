name: V91 visitor-first snapshot recovery
on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - workspace.js
      - visual-terminal.js
      - daily-monitor.js
      - tests/test_visitor_recovery_browser.cjs
      - .github/workflows/visitor-first-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visitor-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the rights-allowlisted public site
        run: python3 scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
      - name: Install Chromium test runner
        run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - name: Verify failure, recovery and mobile layout
        run: |
          node --check tests/test_visitor_recovery_browser.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/energy-public" >/tmp/energy-visitor-http.log 2>&1 &
          node tests/test_visitor_recovery_browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visitor-recovery-screenshots
          path: visitor-recovery-*.png
          retention-days: 14
