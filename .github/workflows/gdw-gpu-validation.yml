name: GPU water layer validation
on:
  pull_request:
    branches: [main]
    paths: [atlas-gdw.js, tests/test_atlas_gdw_browser.cjs, .github/workflows/gdw-gpu-validation.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: node --check atlas-gdw.js
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/energy-public" >/tmp/energy-gdw.log 2>&1 &
          node tests/test_atlas_gdw_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gdw-gpu-review
          path: /tmp/global-atlas-review/*.png
          if-no-files-found: warn
