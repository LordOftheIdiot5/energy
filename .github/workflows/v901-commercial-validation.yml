name: V90.1 commercial readiness validation
on:
  push:
    branches: [release/v90-1-commercial-readiness-20261118, fix/v901-restore-nordic-prices-20261118, feature/v902-hydapi-fingrid-20261118, feature/v902-observations-explorer-20261118, feature/v902-nordic-history-20261119, feature/v902-energy-research-access-20261119, feature/v903a-energy-network-brand-20261119, feature/v904a-unified-atlas-20261119, feature/v904b-hydro-network-20261119, feature/v905a-professional-charts-20261119, feature/v905b-chart-laboratory-20261119, feature/v906-ssb-energy-statistics-20261119, feature/v906b-energinet-20261119]
  pull_request:
    branches: [main]
    paths:
      - scripts/build_plant_pages.py
      - scripts/european_plant_pages.py
      - scripts/publication_policy.py
      - tests/test_static_plants.py
      - tests/test_publication_policy.py
      - .github/workflows/v901-commercial-validation.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Syntax and full offline tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          for f in *.js; do node --check "$f"; done
          node tests/test_visual_terminal.cjs
          node tests/test_energy_data_access.cjs
          node tests/test_daily_monitor.cjs
          node tests/test_atlas.cjs
          node tests/test_atlas_assets.cjs
          node tests/test_hydro_atlas.cjs
          node tests/test_professional_charts.cjs
          node tests/test_chart_lab.cjs
      - name: Verify official SSB live endpoints on V90.6 branch
        if: contains(github.ref, 'v906-ssb') || contains(github.head_ref, 'v906-ssb')
        run: python -u scripts/ssb_energy.py --force
      - name: Verify Energinet metadata and real source on Danish branch
        if: contains(github.ref, 'v906b-energinet') || contains(github.head_ref, 'v906b-energinet')
        run: |
          python -u scripts/energinet_energy.py --metadata
          python -u scripts/energinet_energy.py --force
      - name: Generate full static directory
        run: python scripts/build_plant_pages.py
      - name: Validate separate public-data projection
        run: python scripts/publication_policy.py --out /tmp/energy-open-projection
      - name: Browser profile validation
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/energy-http.log 2>&1 &
          node tests/test_static_plant_browser.cjs
      - name: Test European profile without JavaScript
        run: |
          node - <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict'),fs=require('fs');
          (async()=>{const d=JSON.parse(fs.readFileSync('data/europe-plants-v1.json'));const id=d.rows[0].id;const b=await chromium.launch({headless:true,args:['--no-sandbox']});try{for(const width of [1440,390]){const p=await b.newPage({viewport:{width,height:900},javaScriptEnabled:false});const path='/plants/wri/'+id+'/';assert.equal((await p.goto('http://127.0.0.1:8765'+path)).status(),200);assert.equal(await p.locator('h1').innerText(),d.rows[0].name);assert.equal(await p.locator('link[rel=canonical]').getAttribute('href'),'https://energy.nordl.dev'+path);assert.ok(await p.getByText('Historical archive · 2021').isVisible());assert.ok(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+2));await p.close();}}finally{await b.close();}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Test projected homepage without modifying source data
        run: node tests/test_projected_home.cjs
      - name: Build and verify exact production artifact
        run: |
          python scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
          test -f "$RUNNER_TEMP/energy-public/plants/europe/index.html"
          test ! -e "$RUNNER_TEMP/energy-public/scripts"
          test ! -e "$RUNNER_TEMP/energy-public/.git"
          test ! -e "$RUNNER_TEMP/energy-public/.github"
          python tests/test_payload.py
      - name: Browser checks against actual staged artifact
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/energy-public" >/tmp/energy-public-http.log 2>&1 &
          ENERGY_TEST_URL=http://127.0.0.1:8766/ node tests/test_projected_home.cjs
      - name: Nordic dataset explorer fixture browser checks
        run: node tests/test_nordic_explorer.cjs

      - name: Energy identity browser validation
        run: node tests/test_energy_brand.cjs

      - name: Daily Energy Monitor browser checks
        run: node tests/test_daily_monitor_browser.cjs

      - name: Unified atlas real-data and fallback checks
        run: node tests/test_atlas_assets_browser.cjs

      - name: Hydro polygon and transfer overlay validation
        run: node tests/test_hydro_atlas_browser.cjs

      - name: Professional chart interaction checks
        run: node tests/test_professional_charts_browser.cjs

      - name: Chart laboratory comparison checks
        run: node tests/test_chart_lab_browser.cjs

      - name: SSB statistics actual data browser check
        if: contains(github.ref, 'v906-ssb') || contains(github.head_ref, 'v906-ssb')
        run: node tests/test_ssb_energy_browser.cjs

      - name: Danish real-data country and archive checks
        if: contains(github.ref, 'v906b-energinet') || contains(github.head_ref, 'v906b-energinet')
        run: node tests/test_energinet_browser.cjs
