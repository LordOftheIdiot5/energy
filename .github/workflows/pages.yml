name: Deploy

# The hourly fetch publishes its own results, so this exists for the other
# case: a change pushed by hand to the page itself, which has no fetch to ride
# along with.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build allowlisted publication artifact
        run: python3 scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
      - name: Stage validated optional Atlas tile delivery
        continue-on-error: true
        uses: ./.github/actions/stage-atlas-tiles
        with:
          public-dir: ${{ runner.temp }}/energy-public
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/energy-public
      - name: Confirm uploaded Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq "$ARTIFACT_ID"; then
              echo "Artifact confirmed; allowing independent Pages indexing."
              sleep 20
              exit 0
            fi
            sleep 5
          done
          echo "::error::Expected uploaded artifact not visible via Actions API"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
