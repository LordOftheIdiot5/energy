name: Hydropower weather benchmark
on:
  push:
    branches: [research/v85-hydro-weather-benchmark-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python -m unittest discover -s tests -v
      - run: python scripts/hydro_weather_benchmark.py --data data --output research-output/v85-benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v85-retrospective-benchmark
          path: research-output/
          retention-days: 30
