name: V90 live user-readiness audit
on:
  push:
    branches: [audit/v90-user-readiness-20261117]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: node tests/audit_v90_live.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v90-live-user-readiness
          path: user-readiness/
          retention-days: 14
