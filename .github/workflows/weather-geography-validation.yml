name: Weather geography validation
on:
  push:
    branches: [feature/v82-weather-hydrology-20261116, feature/v82-snow-map-20261116]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: node --check weather-geography.js && node --check energy-atlas.js && python -m unittest discover -s tests -v
      - run: |
          python scripts/weather_geography.py data
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('data/weather-geography-v1.json').read_text())
          assert d['radar'] and pathlib.Path('data',d['radar']['file']).is_file(), 'Radar source failed'
          assert len(d['snow'])>0, 'No validated SWE samples; cannot claim snow data works'
          print('Real radar image and valid SWE samples:',len(d['snow']), '/', d['snow_expected'])
          for r in d['snow']: print(r['id'],r['date'],r['value_mm'],'mm')
          PY
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/energy-http.log 2>&1 &
          node tests/test_weather_geography_browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: weather-geography-evidence
          path: weather-geography.png
          retention-days: 7
