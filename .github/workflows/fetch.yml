name: Fetch

on:
  # GitHub schedule is the primary autonomous trigger; VPS and Cloudflare are optional backups.
  # Twice-hourly checks assess freshness and
  # skips expensive collection when the current published snapshot is recent.
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      recovery:
        description: Check freshness and collect or republish only if required
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch.yml
      - scripts/fetch.py
      - scripts/publish_fetch.sh
      - scripts/freshness_guard.py
      - tests/test_asset_reference.py
      - scripts/hydro_extended.py
      - scripts/shared_energy.py
      - scripts/energy_geography.py
      - scripts/hydro_validation.py
      - scripts/asset_reference.py
      - scripts/weather_geography.py
      - scripts/price_rights.py
      - scripts/delivery_prices.py
      - scripts/open_history.py
      - scripts/publication_policy.py
      - scripts/build_public_site.py
      - scripts/economic_reference.py
      - scripts/nordic_observations.py
      - tests/test_nordic_observations.py
      - tests/test_v901_data.py
      - tests/test_archive_sources.py
      - tests/test_weather_geography.py

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    # Pinned, where the deploy job below is not. This one runs unattended
    # every hour and a change underneath it shows up as stale data rather
    # than as a failure anyone notices. ubuntu-latest began migrating to
    # Ubuntu 26 on 2026-10-19; moving is fine, but on a day we choose.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Decide freshness recovery action
        id: guard
        env:
          RECOVERY: ${{ inputs.recovery || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          event="$EVENT_NAME"
          if [ "$RECOVERY" = true ]; then event=schedule; fi
          python scripts/freshness_guard.py --event "$event" --output "$GITHUB_OUTPUT"

      - name: Offline regression tests
        if: steps.guard.outputs.mode == 'collect'
        run: python -m unittest discover -s tests -v

      - name: Fetch
        if: steps.guard.outputs.mode == 'collect'
        env:
          # Only source here that needs a credential. GIE require a free
          # registration at agsi.gie.eu/account. Absent, the gas storage
          # panel is skipped and everything else runs unchanged.
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          NORDIC_OBSERVATIONS_DEDICATED: "1"
          NVE_HYDAPI_KEY: ${{ secrets.NVE_HYDAPI_KEY }}
          HYDAPI_API_KEY: ${{ secrets.HYDAPI_API_KEY }}
          HYDAPI_KEY: ${{ secrets.HYDAPI_KEY }}
          NVE_HYDAPI_API_KEY: ${{ secrets.NVE_HYDAPI_API_KEY }}
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          FINGRID_KEY: ${{ secrets.FINGRID_KEY }}
        run: python scripts/fetch.py

      - name: Sanity check
        if: steps.guard.outputs.mode == 'collect'
        run: |
          python tests/test_payload.py
          python -m unittest discover -s tests -p test_energy_geography.py
          python -m unittest discover -s tests -p test_asset_reference.py

      - name: Commit results with bounded conflict recovery
        if: steps.guard.outputs.mode == 'collect'
        env:
          # Only source here that needs a credential. GIE require a free
          # registration at agsi.gie.eu/account. Absent, the gas storage
          # panel is skipped and everything else runs unchanged.
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
          NORDIC_OBSERVATIONS_DEDICATED: "1"
          NVE_HYDAPI_KEY: ${{ secrets.NVE_HYDAPI_KEY }}
          HYDAPI_API_KEY: ${{ secrets.HYDAPI_API_KEY }}
          HYDAPI_KEY: ${{ secrets.HYDAPI_KEY }}
          NVE_HYDAPI_API_KEY: ${{ secrets.NVE_HYDAPI_API_KEY }}
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
          FINGRID_KEY: ${{ secrets.FINGRID_KEY }}
        run: bash scripts/publish_fetch.sh

  # A push made with the built-in GITHUB_TOKEN deliberately does not start
  # another workflow, so a Deploy job listening for pushes would never hear
  # the commit above. stockwatch spent a week serving stale data for exactly
  # this reason, so the fetch publishes its own results instead of waiting to
  # be noticed.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicitly main, not this run's own SHA: that commit predates the one
      # the fetch just pushed, so checking it out would republish the data
      # this run has already replaced.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Build allowlisted publication artifact
        run: python3 scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
      - name: Stage validated optional Atlas tile delivery
        continue-on-error: true
        uses: ./.github/actions/stage-atlas-tiles
        with:
          public-dir: ${{ runner.temp }}/energy-public
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/energy-public
      - name: Confirm uploaded Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Expected uploaded artifact not visible via Actions API"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
