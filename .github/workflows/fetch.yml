name: Fetch

on:
  # A fallback, not the schedule. The hourly trigger is a systemd timer on the
  # VPS, because GitHub's cron is best effort and has dropped eighteen
  # consecutive hours on the sibling repo while reporting every run a success.
  #
  # Every six hours rather than hourly so the two do not race or double the
  # commits. If the VPS goes down this keeps the page roughly current, and the
  # page's own staleness banner - which trips at three hours - says plainly
  # that something has stopped.
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    # Pinned, where the deploy job below is not. This one runs unattended
    # every hour and a change underneath it shows up as stale data rather
    # than as a failure anyone notices. ubuntu-latest began migrating to
    # Ubuntu 26 on 2026-10-19; moving is fine, but on a day we choose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch
        env:
          # Only source here that needs a credential. GIE require a free
          # registration at agsi.gie.eu/account. Absent, the gas storage
          # panel is skipped and everything else runs unchanged.
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: python scripts/fetch.py

      - name: Sanity check
        run: python tests/test_payload.py

      - name: Commit results
        run: |
          git config user.name "energy"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "fetch: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

  # A push made with the built-in GITHUB_TOKEN deliberately does not start
  # another workflow, so a Deploy job listening for pushes would never hear
  # the commit above. stockwatch spent a week serving stale data for exactly
  # this reason, so the fetch publishes its own results instead of waiting to
  # be noticed.
  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicitly main, not this run's own SHA: that commit predates the one
      # the fetch just pushed, so checking it out would republish the data
      # this run has already replaced.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
