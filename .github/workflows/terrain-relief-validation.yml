name: Terrain relief validation
on:
  push:
    branches: [feature/v79-terrain-relief-20261116]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: node --check terrain-relief.js && node --check regional-atlas.js && node tests/test_terrain_relief.cjs && node tests/test_regional_atlas.cjs
      - run: python -m unittest discover -s tests -v
      - run: npm install --no-save --no-package-lock playwright@1.56.1 maplibre-gl@5.6.1 leaflet@1.9.4 && npx playwright install chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/energy-http.log 2>&1 &
          node tests/test_terrain_relief_browser.cjs
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: |
          python - <<'PY'
          import math, urllib.request
          z=9; lat=63.4; lon=10.4
          x=int((lon+180)/360*2**z)
          y=int((1-math.asinh(math.tan(math.radians(lat)))/math.pi)/2*2**z)
          u=f'https://tiles.mapterhorn.com/{z}/{x}/{y}.webp'
          req=urllib.request.Request(u,headers={'User-Agent':'Nordl Energy (https://energy.nordl.dev/)','Origin':'https://energy.nordl.dev'})
          with urllib.request.urlopen(req,timeout=30) as f:
              raw=f.read(2000000)
              assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP', 'Expected WebP terrain tile'
              assert f.headers.get('Access-Control-Allow-Origin') in ('*','https://energy.nordl.dev'), 'CORS unavailable'
              print('Verified live terrain tile:',u,len(raw),'bytes')
          PY
