name: Expanded ODbL atlas acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - atlas-regional-grid.js
      - index.html
      - scripts/osm_grid_expansion_publication.py
      - scripts/build_public_site.py
      - tests/test_grid_expansion_browser.cjs
      - .github/workflows/grid-expansion-atlas.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: node --check atlas-regional-grid.js
      - run: python -m unittest discover -s tests -p 'test_osm_grid*.py' -v
      - run: python scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
      - name: Exact published coverage and archive separation
        run: |
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"energy-public/data"
          assert not (root/"osm-grid-expansion-reviewed").exists()
          d=root/"osm-grid-expansion"
          entries=json.loads((d/"index-v1.json").read_text())["datasets"]
          assert {e["region"]:e["source_records"] for e in entries}=={"FO":67,"EE":3921,"LV":12775,"AL":775}
          assert all(hashlib.sha256((d/e["path"]).read_bytes()).hexdigest()==e["sha256"] for e in entries)
          PY
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/energy-public" >/tmp/energy-http.log 2>&1 &
          node tests/test_atlas_regional_grid_browser.cjs
          node tests/test_grid_expansion_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-expansion-browser
          path: |
            /tmp/grid-expansion-review/
            /tmp/global-atlas-review/
          if-no-files-found: warn
