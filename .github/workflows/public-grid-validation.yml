name: Published grid overlay validation
on:
  push:
    branches: [feature/v81-public-grid-map-20261116]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: node --check public-grid-map.js && node --check energy-atlas.js && node tests/test_public_grid_map.cjs && node tests/test_atlas.cjs
      - run: python -m unittest discover -s tests -v
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/energy-http.log 2>&1 &
          node tests/test_public_grid_browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: physical-grid-screenshot
          path: map-verification/
          retention-days: 7
