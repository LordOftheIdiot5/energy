name: Satellite imagery validation
on:
  push:
    branches: [feature/v80-satellite-imagery-20261116]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: node --check satellite-layer.js && node --check regional-atlas.js && node tests/test_satellite_layer.cjs && node tests/test_terrain_relief.cjs && node tests/test_regional_atlas.cjs
      - run: python -m unittest discover -s tests -v
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/energy-http.log 2>&1 &
          node tests/test_satellite_browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: terrain-satellite-screenshots
          path: map-verification/
          retention-days: 7
