name: Energy map and chart validation
on:
  push:
    branches: [feature/energy-v56-70-map-chart-20261116]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: node --check energy-atlas.js && node --check energy-map.js && node tests/test_atlas.cjs && node tests/test_visual_terminal.cjs
      - run: python -m unittest discover -s tests -v
      - run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          import pathlib, subprocess
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.inside=False; self.scripts=[]; self.buffer=[]
              def handle_starttag(self,tag,attrs):
                  self.ids.extend(v for k,v in attrs if k=='id')
                  if tag=='script' and not dict(attrs).get('src'): self.inside=True; self.buffer=[]
              def handle_data(self,data):
                  if self.inside:self.buffer.append(data)
              def handle_endtag(self,tag):
                  if tag=='script' and self.inside:self.scripts.append(''.join(self.buffer));self.inside=False
          p=Page();p.feed(open('index.html').read())
          assert not [k for k,v in Counter(p.ids).items() if v>1]
          for k in ['atlasMap','atlasVector','atlasDetailed','atlasEurope','atlasNordic','atlasNorway','atlasPlants','atlasStatus']: assert k in p.ids,k
          for i,s in enumerate(p.scripts):
              f=pathlib.Path('/tmp')/f'energy-inline-{i}.js';f.write_text(s);subprocess.run(['node','--check',str(f)],check=True)
          print('HTML IDs and inline JavaScript validated')
          PY
