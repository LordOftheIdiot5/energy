name: Data publication conflict validation
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/publish_fetch.sh
      - tests/test_publish_fetch_retry.py
      - .github/workflows/fetch.yml
      - .github/workflows/fetch-retry-validation.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash -n scripts/publish_fetch.sh
      - run: python -m unittest discover -s tests -p test_publish_fetch_retry.py -v
