name: Production map smoke test
on:
  push:
    branches: [chore/v78-production-map-verification-20261116]
  pull_request:
    branches: [main]
    paths:
      - tests/test_live_maps.cjs
      - .github/workflows/production-map-smoke.yml
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  live-maps:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: node tests/test_live_maps.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: production-map-screenshots
          path: map-verification/
          retention-days: 7
