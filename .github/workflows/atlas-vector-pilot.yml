name: Atlas vector archive pilot
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/atlas_vector_tiles.py
      - tests/test_atlas_vector_tiles.py
      - .github/workflows/atlas-vector-pilot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned vector encoders
        run: python -m pip install 'pmtiles==3.8.1' 'mapbox-vector-tile==2.2.0'
      - name: Projection and accounting tests
        run: python -m unittest discover -s tests -p test_atlas_vector_tiles.py -v
      - name: Build and fully decode vector archive
        run: python -u scripts/atlas_vector_tiles.py --source data/global-plants-wri-v130.json --out "$RUNNER_TEMP/atlas-vector-pilot"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-vector-pilot
          path: ${{runner.temp}}/atlas-vector-pilot/
          if-no-files-found: error
