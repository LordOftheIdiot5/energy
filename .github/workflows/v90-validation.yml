name: V90 consolidated release validation
on:
  push:
    branches: [release/v90-final-20261116]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: |
          for file in *.js; do node --check "$file"; done
          for file in tests/*.cjs; do case "$file" in *browser*|*live_maps*) ;; *) node "$file";; esac; done
          python -m unittest discover -s tests -v
          python tests/test_payload.py
      - run: npm install --no-save --no-package-lock playwright@1.56.1 maplibre-gl@5.6.1 leaflet@1.9.4 && npx playwright install chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/energy-http.log 2>&1 &
          node tests/test_v90_browser.cjs
          node tests/test_plant_profile_browser.cjs
          node tests/test_atlas_zoom_browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v90-validation-screenshots
          path: |
            v90-*.png
            *-profile.png
            atlas-zoom-overview.png
          retention-days: 14
