name: V91 live visitor smoke
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  homepage:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Browser dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - name: Verify actual published homepage and routes
        run: |
          node --check tests/test_visitor_live_browser.cjs
          node tests/test_visitor_live_browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visitor-live-captures
          path: visitor-live/
          retention-days: 14
