name: Plant profile validation
on:
  push:
    branches: [feature/v84-asset-profiles-20261116]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: node --check plant-profile.js && node --check geography.js && node --check portal.js && node --check energy-atlas.js && node tests/test_plant_profile.cjs && python -m unittest discover -s tests -v
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/energy-http.log 2>&1 &
          node tests/test_plant_profile_browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plant-profile-screenshots
          path: '*-profile.png'
          retention-days: 7
