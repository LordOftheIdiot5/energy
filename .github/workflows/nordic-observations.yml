name: Nordic observations
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nordic-observations.yml
      - scripts/nordic_observations.py
      - scripts/nordic_backfill.py
      - scripts/ssb_energy.py
      - scripts/energinet_energy.py
  schedule:
    - cron: '8 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nordic-observations
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Collect and validate only Nordic observations
        env:
          NVE_HYDAPI_KEY: ${{ secrets.NVE_HYDAPI_KEY }}
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
        run: |
          python -u scripts/nordic_observations.py
          python -u scripts/nordic_backfill.py
          if [ -f data/energinet-v1.json ] && [ "$(date -u +%H)" = 10 ]; then python -u scripts/energinet_energy.py --history; elif [ -f data/energinet-v1.json ] && [ "$(date -u +%H)" = 11 ]; then python -u scripts/energinet_energy.py --refresh; else python -u scripts/energinet_energy.py; fi
          if [ ! -f data/ssb-08307-v1.json ] || [ ! -f data/ssb-14091-v1.json ] || [ ! -f data/ssb-14092-v1.json ] || [ ! -f data/ssb-14093-v1.json ] || [ "$(date -u +%H)" = 09 ]; then python -u scripts/ssb_energy.py; fi
          python - <<'PY'
          import sys,json
          sys.path.insert(0,"scripts")
          from pathlib import Path
          from nordic_observations import public_files
          files=list(public_files(Path("data")))
          print("Validated files:",files)
          for provider in ("hydapi","fingrid"):
              p=Path("data")/(provider+"-v1.json")
              if not p.exists() or not json.loads(p.read_text())["rows"]:
                  print("::warning::"+provider+" has no published observations yet")
          PY
      - name: Publish independent data transaction
        run: |
          git config user.name "energy-observations"
          git config user.email "actions@github.com"
          git add -- 'data/hydapi*.json' 'data/fingrid*.json' data/observations/
          for p in data/ssb-*-v1.json; do if [ -f "$p" ]; then git add -- "$p"; fi; done
          if [ -d data/ssb-revisions ]; then git add -- data/ssb-revisions/; fi
          for p in data/energinet-v1.json data/energinet-history data/energinet-revisions data/energinet-backfill-state-v1.json; do if [ -e "$p" ]; then git add -- "$p"; fi; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Nordic observations: $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Another writer changed Nordic observation files; refusing overwrite"
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
  deploy:
    needs: collect
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: python3 scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/energy-public
      - name: Confirm uploaded Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for i in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Expected uploaded artifact not visible via Actions API"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
