name: Global Dam Watch immutable archive
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/gdw_publication.py
      - tests/test_gdw_publication.py
      - .github/workflows/gdw-archive.yml
  push:
    branches: [main]
    paths:
      - scripts/gdw_publication.py
      - .github/workflows/gdw-archive.yml
  workflow_dispatch:
concurrency:
  group: gdw-archive-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate publication and collect pinned source
        run: |
          python -m pip install 'pyshp==2.3.1' 'pyproj==3.7.2'
          python -m unittest discover -s tests -p 'test_gdw*.py' -v
          python -u scripts/gdw_barriers.py --out "$RUNNER_TEMP/gdw-source"
          python scripts/gdw_publication.py --incoming "$RUNNER_TEMP/gdw-source/gdw-barriers-v1.json" --root data/gdw
          python scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
      - name: Check actual public projection
        run: |
          python - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"energy-public/data/gdw"
          i=json.loads((p/"index-v1.json").read_text())
          assert i["source_records"]==41145
          assert hashlib.sha256((p/i["path"]).read_bytes()).hexdigest()==i["sha256"]
          assert set(f.name for f in p.iterdir())=={"index-v1.json","gdw-barriers-v1.json"}
          print("PASS immutable GDW public projection",i["source_records"])
          PY
      - name: Save immutable normalized source on main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "energy-gdw-archive"
          git config user.email "actions@github.com"
          git add -- data/gdw/gdw-barriers-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive validated Global Dam Watch v1.0 normalized release"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
      - name: Request verified shared Pages deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
