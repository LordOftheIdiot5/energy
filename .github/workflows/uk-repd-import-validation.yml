name: UK REPD international-project import validation
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/import_uk_repd.py
      - tests/test_uk_repd_import.py
      - .github/workflows/uk-repd-import-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Unit tests without network or raw data
        run: python -m unittest discover -s tests -p test_uk_repd_import.py -v
      - name: Install coordinate converter
        run: pip install pyproj==3.7.2
      - name: Obtain official UK DESNZ quarterly CSV
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            'https://assets.publishing.service.gov.uk/media/6af42ff0a4004bdbe54e54a5/REPD_Publication_Q3_2026.csv' \
            --output /tmp/uk-repd.csv
      - name: Normalize and validate actual records
        run: |
          python scripts/import_uk_repd.py --source-csv /tmp/uk-repd.csv --out /tmp/uk-repd-review/uk-repd-projects-v1.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/uk-repd-review/uk-repd-projects-v1.json'))
          assert d['counts']['mapped_records']>=5000
          assert all(r['country'] in ('England','Scotland','Wales') for r in d['rows'])
          print('REPD projected:',d['counts'])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: uk-repd-review-projection
          path: /tmp/uk-repd-review/uk-repd-projects-v1.json
          retention-days: 14
