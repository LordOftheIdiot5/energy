name: V90.6g4b mixed Atlas dateline and memory regression
on:
  pull_request:
    branches: [main]
    paths:
      - atlas-us-generators.js
      - tests/test_us_generator_dateline_bounds.cjs
      - tests/test_atlas_mixed_stress_browser.cjs
      - docs/V90.6g4b-MIXED-ATLAS-AUDIT.md
      - .github/workflows/mixed-atlas-memory-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Source admission and validated inventory coordinates
        run: |
          node --check atlas-us-generators.js
          node --check tests/test_atlas_mixed_stress_browser.cjs
          node tests/test_atlas_us_generators.cjs
          node tests/test_us_generator_dateline_bounds.cjs
          node tests/test_atlas_uk_projects.cjs
          node tests/test_atlas_nacei.cjs
          node tests/test_atlas_gem_pipelines.cjs
      - name: Build isolated rights-approved public Pages artifact
        run: python scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
      - name: Install pinned Chromium for true mixed-layer browser acceptance
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run mixed UK, US, NACEI and GEM responsive stress audit
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/energy-public" >/tmp/mixed-atlas-20261121.log 2>&1 &
          ENERGY_TEST_URL=http://127.0.0.1:8766/ node tests/test_atlas_mixed_stress_browser.cjs
      - name: Original US generator inspector, inventory-switch and UK coexistence
        shell: bash
        run: ENERGY_TEST_URL=http://127.0.0.1:8766/ node tests/test_atlas_us_generators_browser.cjs
