name: NACEI 2017 historical oil and gas atlas validation
on:
  pull_request:
    branches: [main]
    paths:
      - data/nacei-oilgas-2017-v1.json
      - atlas-nacei-oilgas.js
      - energy-atlas.js
      - index.html
      - energy-pro.css
      - scripts/build_public_site.py
      - scripts/nacei_publication.py
      - tests/test_nacei_publication.py
      - tests/test_atlas_nacei.cjs
      - tests/test_atlas_nacei_browser.cjs
      - .github/workflows/nacei-public-atlas.yml
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - run: node --check atlas-nacei-oilgas.js && node --check energy-atlas.js && node tests/test_atlas_nacei.cjs
      - run: python -m unittest discover -s tests -p test_nacei_publication.py -v
      - run: python scripts/build_public_site.py --out "$RUNNER_TEMP/energy-public"
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/energy-public" >/tmp/nacei-atlas.log 2>&1 &
          ENERGY_TEST_URL=http://127.0.0.1:8766/ node tests/test_atlas_nacei_browser.cjs
  live:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install chromium
      - env:
          ENERGY_TEST_URL: https://energy.nordl.dev/
        run: node tests/test_atlas_nacei_browser.cjs
